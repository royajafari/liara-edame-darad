<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>هایلایت‌ها — ادامه دارد…</title>
<link rel="stylesheet" href="../assets/campaign.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { background: #050914; font-family: var(--font); color: var(--ice); }
  body.single { width: 1080px; height: 1920px; overflow: hidden; }
  body.all { display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; zoom: .3; }

  .frame { width: 1080px; height: 1920px; position: relative; overflow: hidden; background: var(--navy);
    background-image: radial-gradient(rgba(138,151,181,.14) 2px, transparent 2.2px); background-size: 44px 44px; }
  .frame::before { content: ""; position: absolute; inset: 0;
    background: radial-gradient(1000px 800px at 50% 40%, rgba(19,184,166,.12), transparent 65%); }
  .frame.alarm::before { background: radial-gradient(1000px 800px at 50% 40%, rgba(246,185,76,.10), transparent 65%); }

  /* Cover: icon centered in the circle-safe area */
  .cover { display: grid; place-items: center; }
  .cover .ring { width: 640px; height: 640px; border-radius: 50%; display: grid; place-items: center; position: relative;
    background: radial-gradient(circle at 50% 40%, #1F2C52, #10182E 70%); border: 6px solid var(--teal); box-shadow: 0 0 120px rgba(19,184,166,.35); }
  .cover.alarm .ring { border-color: var(--amber); box-shadow: 0 0 120px rgba(246,185,76,.25); }
  .cover svg { width: 330px; height: 330px; }
  .cover .label { position: absolute; bottom: 560px; left: 0; right: 0; text-align: center; font-weight: 900; font-size: 64px; }

  /* Story frames — content kept inside 250px top/bottom safe zones */
  .story { padding: 260px 96px 0; }
  .story .tagline { position: absolute; top: 120px; right: 96px; left: 96px; display: flex; justify-content: space-between; align-items: center; font-size: 30px; color: var(--muted); font-weight: 700; }
  .story .tagline b { color: var(--ice); font-weight: 900; }
  .eyebrow { display: inline-flex; align-items: center; gap: 14px; font-weight: 800; font-size: 34px; color: var(--teal); position: relative; }
  .alarm .eyebrow { color: var(--amber); }
  .eyebrow::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: currentColor; box-shadow: 0 0 18px currentColor; }
  h2 { font-weight: 900; font-size: 92px; line-height: 1.35; margin-top: 28px; position: relative; }
  h2 em { font-style: normal; color: var(--teal); }
  .alarm h2 em { color: var(--amber); }
  p.body { font-size: 40px; line-height: 1.8; color: #C9D2E6; margin-top: 30px; position: relative; }
  .list { margin-top: 50px; display: grid; gap: 20px; position: relative; }
  .row { display: flex; gap: 24px; align-items: center; background: var(--navy-700); border: 1px solid var(--navy-600); border-radius: 24px; padding: 28px 32px; font-size: 38px; font-weight: 600; }
  .row .ic { flex: 0 0 66px; height: 66px; border-radius: 18px; display: grid; place-items: center; font-weight: 900; font-size: 32px; background: rgba(19,184,166,.14); color: var(--teal); }
  .row small { display: block; color: var(--muted); font-size: 28px; font-weight: 400; }
  .alarm .row { border-style: dashed; border-color: rgba(246,185,76,.5); }
  .alarm .row .ic { background: rgba(246,185,76,.12); color: var(--amber); }
  .term { margin-top: 44px; background: #070C19; border: 1px solid var(--navy-600); border-radius: 26px; direction: ltr; text-align: left; position: relative; overflow: hidden; }
  .term .bar { height: 60px; background: #0E1630; display: flex; align-items: center; gap: 14px; padding: 0 24px; font-family: var(--mono); color: var(--muted); font-size: 24px; }
  .term .bar i { width: 18px; height: 18px; border-radius: 50%; background: #2A3557; }
  .term pre { font-family: var(--mono); font-size: 26px; line-height: 1.75; padding: 28px 28px 32px; white-space: pre-wrap; word-break: break-all; }
  .p { color: var(--muted); } .ok { color: var(--teal); } .k { color: var(--amber); }
  .chips { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 44px; direction: ltr; justify-content: flex-end; position: relative; }
  .chip { font-family: var(--mono); font-size: 32px; padding: 14px 26px; border-radius: 999px; border: 2px solid var(--teal); color: var(--teal-300); background: rgba(19,184,166,.08); }
  .poll { margin-top: 60px; background: var(--ice); color: var(--navy); border-radius: 32px; padding: 34px; position: relative; box-shadow: 0 30px 80px rgba(0,0,0,.4); }
  .poll b { display: block; font-size: 40px; font-weight: 900; text-align: center; margin-bottom: 24px; }
  .poll div { display: flex; gap: 16px; }
  .poll span { flex: 1; text-align: center; padding: 22px; border-radius: 18px; background: #E3E9F3; font-weight: 800; font-size: 36px; }
  .poll span:first-child { color: #0E8F81; } .poll span:last-child { color: #C2841B; }
  .link { margin-top: 60px; display: inline-flex; align-items: center; gap: 18px; background: var(--ice); color: var(--navy); padding: 26px 40px; border-radius: 22px; font-weight: 900; font-size: 40px; position: relative; box-shadow: 0 30px 80px rgba(0,0,0,.4); }
  .link::before { content: "🔗"; font-size: 34px; }
  .steps { margin-top: 50px; display: grid; gap: 22px; position: relative; }
  .step { display: grid; grid-template-columns: 90px 1fr; gap: 26px; align-items: center; }
  .step b { width: 90px; height: 90px; border-radius: 50%; background: var(--teal); color: var(--navy-900); display: grid; place-items: center; font-size: 44px; font-weight: 900; }
  .step div { font-size: 40px; font-weight: 700; }
  .step small { display: block; font-size: 28px; color: var(--muted); font-weight: 400; font-family: var(--font); }
  .step code { font-family: var(--mono); color: var(--teal-300); font-size: 30px; direction: ltr; display: inline-block; }
  .foot { position: absolute; bottom: 270px; left: 96px; right: 96px; display: flex; justify-content: flex-end; align-items: center; gap: 16px; font-size: 34px; font-weight: 800; }
  .foot .dots { font-size: 64px; }
  .dots.all-on i { background: var(--teal); box-shadow: var(--glow); }
</style>
</head>
<body>
<div id="root"></div>
<script>
const I = {
  // broken link
  cut: `<svg viewBox="0 0 100 100" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M42 30 L52 20 a14 14 0 0 1 20 0 l8 8 a14 14 0 0 1 0 20 L70 58" stroke="#F4F7FB" stroke-width="7"/><path d="M58 70 L48 80 a14 14 0 0 1 -20 0 l-8 -8 a14 14 0 0 1 0 -20 L30 42" stroke="#F4F7FB" stroke-width="7"/><path d="M40 60 L60 40" stroke="#F6B94C" stroke-width="7" stroke-dasharray="6 9"/></svg>`,
  // download into box
  mirror: `<svg viewBox="0 0 100 100" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M50 14 V58" stroke="#13B8A6" stroke-width="8"/><path d="M32 42 L50 60 L68 42" stroke="#13B8A6" stroke-width="8"/><path d="M18 64 V80 a6 6 0 0 0 6 6 H76 a6 6 0 0 0 6 -6 V64" stroke="#F4F7FB" stroke-width="7"/></svg>`,
  // server stack
  infra: `<svg viewBox="0 0 100 100" fill="none" stroke-linecap="round"><rect x="16" y="16" width="68" height="26" rx="7" stroke="#F4F7FB" stroke-width="7"/><rect x="16" y="58" width="68" height="26" rx="7" stroke="#F4F7FB" stroke-width="7"/><circle cx="30" cy="29" r="4.5" fill="#13B8A6"/><circle cx="30" cy="71" r="4.5" fill="#13B8A6"/><path d="M48 29 H70 M48 71 H70" stroke="#8A97B5" stroke-width="6"/></svg>`,
  // checklist
  ready: `<svg viewBox="0 0 100 100" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="18" y="12" width="64" height="78" rx="10" stroke="#F4F7FB" stroke-width="7"/><path d="M30 38 L38 46 L52 32" stroke="#13B8A6" stroke-width="7"/><path d="M30 64 L38 72 L52 58" stroke="#13B8A6" stroke-width="7"/><path d="M60 40 H70 M60 66 H70" stroke="#8A97B5" stroke-width="6"/></svg>`,
  // three lit dots
  start: `<svg viewBox="0 0 100 100"><circle cx="22" cy="50" r="11" fill="#13B8A6"/><circle cx="50" cy="50" r="11" fill="#13B8A6"/><circle cx="78" cy="50" r="11" fill="#13B8A6"/><circle cx="22" cy="50" r="18" fill="#13B8A6" opacity=".25"/></svg>`,
};

const F = {};
const cover = (id, icon, label, alarm) => F['c' + id] = `<section class="frame cover ${alarm ? 'alarm' : ''}"><div class="ring">${I[icon]}</div></section>`;
cover(1, 'cut', 'قطعی؟', true);
cover(2, 'mirror', 'میرورها');
cover(3, 'infra', 'زیرساخت');
cover(4, 'ready', 'آماده‌ای؟');
cover(5, 'start', 'شروع کن');

const header = (h) => `<div class="tagline"><span><b>لیارا</b> · ${h}</span><span>#ادامه_دارد</span></div>`;
const foot = (on) => `<div class="foot">${on ? 'ادامه‌اش با تو' : 'ادامه دارد'} <span class="dots ${on ? 'all-on' : ''}"><i></i><i></i><i></i></span></div>`;
const story = (id, cls, hl, body, on) => F[id] = `<section class="frame story ${cls}">${header(hl)}${body}${foot(on)}</section>`;

// 1 — قطعی؟
story('s1-1', 'alarm', 'قطعی؟', `
  <div class="eyebrow">روز قطعی</div>
  <h2>قطعی که بیاد،<br><em>چی از کار می‌افته؟</em></h2>
  <div class="list">
    <div class="row"><span class="ic">!</span><div>نصب پکیج و ایمیج<small>npm، pip، Docker Hub</small></div></div>
    <div class="row"><span class="ic">!</span><div>سرور و دیتابیس خارجی</div></div>
    <div class="row"><span class="ic">!</span><div>فونت، CDN و APIهای بیرونی</div></div>
    <div class="row"><span class="ic">!</span><div>بکاپی که بیرون از دسترسه</div></div>
  </div>`);
story('s1-2', 'alarm', 'قطعی؟', `
  <div class="eyebrow">یه سؤال</div>
  <h2>آخرین قطعی،<br>کارت <em>چند ساعت</em><br>خوابید؟</h2>
  <div class="poll"><b>تو قطعی قبلی، کارت ادامه داشت؟</b><div><span>آره، آماده بودیم</span><span>نه، خوابید</span></div></div>
  <p class="body">جواب هرچی باشه، تو هایلایت‌های بعدی راهش رو گذاشتیم.</p>`);

// 2 — میرورها
story('s2-1', '', 'میرورها', `
  <div class="eyebrow">میرورهای لیارا</div>
  <h2>پکیج‌ها،<br><em>بدون اینترنت<br>بین‌الملل.</em></h2>
  <p class="body">نسخه‌ی کش‌شده‌ی مخزن‌های اصلی، داخل ایران:</p>
  <div class="chips"><span class="chip">npm</span><span class="chip">PyPI</span><span class="chip">Docker Hub</span><span class="chip">Composer</span><span class="chip">Go</span><span class="chip">NuGet</span><span class="chip">GitHub</span><span class="chip">Ubuntu</span><span class="chip">Debian</span><span class="chip">Alpine</span></div>`);
story('s2-2', '', 'میرورها', `
  <div class="eyebrow">npm و pip</div>
  <h2>یه خط تنظیم،<br><em>نصب ادامه داره.</em></h2>
  <div class="term"><div class="bar"><i></i><i></i><i></i>&nbsp; npm</div><pre><span class="p">$</span> npm config set registry \\
  https://package-mirror.liara.ir/repository/npm/ \\
  --global</pre></div>
  <div class="term"><div class="bar"><i></i><i></i><i></i>&nbsp; pip</div><pre><span class="p">$</span> export PIP_INDEX_URL=\\
https://package-mirror.liara.ir/repository/pypi/simple</pre></div>`);
story('s2-3', '', 'میرورها', `
  <div class="eyebrow">Docker</div>
  <h2>ایمیج‌ها هم<br><em>از داخل.</em></h2>
  <div class="term"><div class="bar"><i></i><i></i><i></i>&nbsp; /etc/docker/daemon.json</div><pre>{
  <span class="k">"registry-mirrors"</span>: [
    <span class="ok">"https://docker-mirror.liara.ir"</span>
  ]
}</pre></div>
  <div class="term"><div class="bar"><i></i><i></i><i></i></div><pre><span class="p">$</span> systemctl daemon-reload
<span class="p">$</span> systemctl restart docker</pre></div>
  <p class="body">راهنمای کامل: liara.ir/mirrors</p>`);

// 3 — زیرساخت
story('s3-1', '', 'زیرساخت', `
  <div class="eyebrow">داخل ایران</div>
  <h2>کد، داده و فایل‌هات<br><em>کنار هم.</em></h2>
  <div class="list">
    <div class="row"><span class="ic">۱</span><div>پلتفرم (PaaS)<small>Node، PHP، Python، Go، .NET، Docker</small></div></div>
    <div class="row"><span class="ic">۲</span><div>دیتابیس ابری<small>MySQL، PostgreSQL، MongoDB، Redis</small></div></div>
    <div class="row"><span class="ic">۳</span><div>ذخیره‌سازی ابری<small>آبجکت استوریج برای فایل‌ها</small></div></div>
    <div class="row"><span class="ic">۴</span><div>سرور مجازی ابری<small>همه‌ی پلن‌ها در ایران</small></div></div>
  </div>`);
story('s3-2', '', 'زیرساخت', `
  <div class="eyebrow">ریسک کم</div>
  <h2>کمتر از ۵ دقیقه<br><em>تا اولین استقرار.</em></h2>
  <div class="list">
    <div class="row"><span class="ic">⏱</span><div>پرداخت ساعتی<small>فقط به اندازه‌ی مصرف</small></div></div>
    <div class="row"><span class="ic">↺</span><div>بکاپ رایگان<small>تا ۱۰ برابر فضای پلن</small></div></div>
    <div class="row"><span class="ic">@</span><div>DNS رایگان<small>دامنه هم کنار بقیه</small></div></div>
  </div>
  <p class="body">یه نسخه‌ی آزمایشی بالا بیار، تست کن، تصمیم بگیر.</p>`);

// 4 — آماده‌ای؟
story('s4-1', '', 'آماده‌ای؟', `
  <div class="eyebrow">تست آمادگی</div>
  <h2>۵ سؤال،<br>۲ دقیقه،<br><em>یه بسته‌ی مخصوص.</em></h2>
  <p class="body">بفهم کار تو کجا به اینترنت بین‌الملل وابسته‌ست و قدم بعدیت چیه.</p>
  <div class="link">تست آمادگی</div>`);
story('s4-2', '', 'آماده‌ای؟', `
  <div class="eyebrow">اسکرین‌شات بگیر 📸</div>
  <h2>چک‌لیست<br><em>قبل از قطعی بعدی</em></h2>
  <div class="list">
    <div class="row"><span class="ic">۱</span><div>npm/pip روی میرور ایرانی</div></div>
    <div class="row"><span class="ic">۲</span><div>registry-mirrors داکر</div></div>
    <div class="row"><span class="ic">۳</span><div>فونت و اسکریپت روی سرور خودت</div></div>
    <div class="row"><span class="ic">۴</span><div>دیتابیس و فایل کنار اپ</div></div>
    <div class="row"><span class="ic">۵</span><div>بکاپ + یه بار تست بازیابی</div></div>
  </div>`);

// 5 — شروع کن
story('s5-1', '', 'شروع کن', `
  <div class="eyebrow">سه قدم</div>
  <h2>قسمت بعدی<br><em>رو خودت بنویس.</em></h2>
  <div class="steps">
    <div class="step"><b>۱</b><div>ثبت‌نام در کنسول لیارا<small>console.liara.ir</small></div></div>
    <div class="step"><b>۲</b><div>نصب CLI<small><code>npm i -g @liara/cli</code></small></div></div>
    <div class="step"><b>۳</b><div>استقرار<small><code>liara deploy</code></small></div></div>
  </div>`, true);
story('s5-2', '', 'شروع کن', `
  <div class="eyebrow">تو روزهای سخت هم</div>
  <h2>اینترنت ممکنه<br>قطع بشه،<br><em>مسیرت نه.</em></h2>
  <p class="body">لندینگ کمپین: تست آمادگی، راهکار مخصوص کارت و شروع روی لیارا.</p>
  <div class="link">ادامه دارد…</div>`, true);

const q = new URLSearchParams(location.search).get('f');
document.getElementById('root').innerHTML = q ? F[q] : Object.values(F).join('');
document.body.className = q ? 'single' : 'all';
</script>
</body>
</html>
